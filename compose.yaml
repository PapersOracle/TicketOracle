name: ticketoracle

services:
  ticketoracle_all_attacks_updated_models:
    build: .
    ports:
      - "127.0.0.1:8020:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TICKETORACLE_VARIANT: app
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/runtime:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/events', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3

  ticketoracle_all_attacks_hardened_updated_models:
    build: .
    ports:
      - "127.0.0.1:8021:8080"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TICKETORACLE_VARIANT: app_hardened
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/runtime:size=16m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/events', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
